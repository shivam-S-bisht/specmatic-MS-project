services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  inventory-service:
    container_name: inventory-service
    build: ./inventory-service
    ports:
      - "13001:3001"
    volumes:
      - ./contracts:/usr/src/contracts:ro

  payment-service:
    container_name: payment-service
    build: ./payment-service
    ports:
      - "13002:3002"
    environment:
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN}
    volumes:
      - ./contracts:/usr/src/contracts:ro

  order-service:
    container_name: order-service
    build: ./order-service
    ports:
      - "13000:3000"
    environment:
      INVENTORY_SERVICE_URL: http://specmatic-tests:9001
      PAYMENT_SERVICE_URL: http://specmatic-tests:9002
      KAFKA_BROKER: kafka:9092
      ORDER_API_KEY: ${ORDER_API_KEY}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN}
    volumes:
      - ./contracts:/usr/src/contracts:ro
    depends_on:
      kafka:
        condition: service_healthy

  shipping-service:
    container_name: shipping-service
    build: ./shipping-service
    ports:
      - "13003:3003"
    environment:
      KAFKA_BROKER: kafka:9092
    volumes:
      - ./contracts:/usr/src/contracts:ro
    depends_on:
      kafka:
        condition: service_healthy

  notification-service:
    container_name: notification-service
    build: ./notification-service
    environment:
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  specmatic-tests:
    image: specmatic/enterprise:latest
    container_name: specmatic-tests
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        sh workflows/arazzo-inputs.sh > workflows/place-order.arazzo_input.json
        specmatic run-suite
    volumes:
      - .:/usr/src/app
      - ./license.txt:/specmatic/specmatic-license.txt:ro
    environment:
      ORDER_API_KEY: ${ORDER_API_KEY}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN}
    ports:
      - "9001:9001"
      - "9002:9002"
    depends_on:
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
