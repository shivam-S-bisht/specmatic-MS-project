name: Specmatic Contract Testing CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]

jobs:
  contract-testing:
    name: Run Specmatic Contract & Workflow Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create License File from Secret
        run: |
          echo "${{ secrets.SPECMATIC_LICENSE }}" > license.txt

      - name: Start Docker Compose Environment and Run Tests
        run: |
          docker compose up specmatic-test --build --abort-on-container-exit

      - name: Stop and Clean Up Containers
        if: always()
        run: |
          docker compose down -v
