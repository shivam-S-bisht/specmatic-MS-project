name: Specmatic Contract Testing CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  contract-testing:
    name: Run Specmatic Contract & Workflow Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create license file from secret
        env:
          SPECMATIC_LICENSE: ${{ secrets.SPECMATIC_LICENSE }}
        run: |
          echo "$SPECMATIC_LICENSE" > license.txt
      - name: Create .env from secrets
        env:
          ORDER_API_KEY: ${{ secrets.ORDER_API_KEY }}
          PAYMENT_SERVICE_TOKEN: ${{ secrets.PAYMENT_SERVICE_TOKEN }}
        run: |
          echo "ORDER_API_KEY=$ORDER_API_KEY" >> .env
          echo "PAYMENT_SERVICE_TOKEN=$PAYMENT_SERVICE_TOKEN" >> .env

      # Exactly the same command developers run locally.
      - name: Run contract & workflow tests
        run: docker compose up specmatic-tests --build --abort-on-container-exit

      - name: Upload Specmatic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatic-reports
          path: build/reports/specmatic
          if-no-files-found: warn

      - name: Stop and clean up containers
        if: always()
        run: docker compose down -v --remove-orphans
