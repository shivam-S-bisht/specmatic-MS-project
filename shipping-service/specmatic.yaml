version: 3

systemUnderTest:
  service:
    definitions:
      - definition:
          source:
            filesystem:
              directory: ../contracts
          specs:
            - shipping-api.yaml
    runOptions:
      openapi:
        type: test
        baseUrl: "http://shipping-service:3003"
        swaggerUrl: "http://shipping-service:3003/swagger.json"
    settings:
      schemaResiliencyTests: all

dependencies:
  services:
    - service:
        definitions:
          - definition:
              source:
                filesystem:
                  directory: ../contracts
              specs:
                - events-api.yaml
        runOptions:
          asyncapi:
            type: mock
            servers:
              - host: "kafka:9092"
                protocol: kafka

specmatic:
  governance:
    successCriteria:
      minCoveragePercentage: 100
      maxMissedOperationsInSpec: 0
      enforce: true
  license:
    path: /specmatic/specmatic-license.txt
